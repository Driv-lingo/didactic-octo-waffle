<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ course.title }}{% endblock %}</title>
<style>
  :root { --fg:#1a1a1a; --bg:#fbfbf8; --mute:#6b6b6b; --line:#ddd; --accent:#1f4e79; --bad:#9b1c1c; --good:#1c6b3a; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8e8e4; --bg:#141414; --mute:#9a9a9a; --line:#333; --accent:#8ab4e8; --bad:#f08c8c; --good:#8ad0a0; --card:#1d1d1d; } }
  body { margin:0; font: 16px/1.5 Georgia, "Times New Roman", serif; color:var(--fg); background:var(--bg); }
  nav { display:flex; gap:1rem; flex-wrap:wrap; padding:.75rem 1rem; border-bottom:1px solid var(--line); font-family: system-ui, sans-serif; font-size:.9rem; }
  nav a { color:var(--accent); text-decoration:none; } nav a.brand { font-weight:700; color:var(--fg); }
  main { max-width: 56rem; margin: 0 auto; padding: 1rem; }
  h1,h2,h3 { font-family: system-ui, sans-serif; line-height:1.2; }
  pre, textarea, code { font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre { white-space: pre-wrap; background:var(--card); border:1px solid var(--line); padding:.75rem; border-radius:6px; }
  textarea { width:100%; min-height:10rem; padding:.5rem; box-sizing:border-box; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  input[type=text], select { padding:.4rem; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  button { font: inherit; font-family: system-ui, sans-serif; padding:.45rem .9rem; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); }
  .mute { color:var(--mute); } .bad { color:var(--bad); } .good { color:var(--good); }
  table { border-collapse:collapse; width:100%; font-family: system-ui, sans-serif; font-size:.92rem; }
  td, th { text-align:left; padding:.35rem .5rem; border-bottom:1px solid var(--line); vertical-align:top; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:1rem; margin:.75rem 0; }
  .chat .u { margin:.5rem 0; padding:.5rem .75rem; border-left:3px solid var(--line); }
  .chat .a { margin:.5rem 0; padding:.5rem .75rem; border-left:3px solid var(--accent); white-space:pre-wrap; }
  .banner { background:#fff3cd; color:#5b4600; padding:.5rem 1rem; font-family: system-ui, sans-serif; font-size:.9rem; }
  .row { display:flex; gap:1rem; flex-wrap:wrap; }
  .pill { display:inline-block; padding:.05rem .5rem; border:1px solid var(--line); border-radius:999px; font-size:.8rem; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<nav>
  <a class="brand" href="/">{{ course.title }}</a>
  <a href="/curriculum">Curriculum</a>
  <a href="/review">Review</a>
  <a href="/plan">Plan</a>
  <a href="/lecture">Lecture</a>
  <a href="/advisor">Advisor</a>
  <a href="/kit">Lab kit</a>
  <span class="mute" style="margin-left:auto">{{ learner }}</span>
</nav>
{% if offline %}<div class="banner">Offline faculty: no model is connected. Only deterministic checks grade anything.</div>{% endif %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
