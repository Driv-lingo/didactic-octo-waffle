[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimum"
version = "0.1.0"
description = "A self-contained, AI-taught, mastery-gated program that takes a learner from zero to graduate qualifying-exam level."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.12",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "click>=8.1",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
minimum = "minimum.cli:main"

[tool.setuptools.packages.find]
include = ["minimum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
